services:
  db:
    image: postgres:16-alpine
    container_name: cloudmight-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Passwd@123 
      POSTGRES_DB: CloudMightDb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: cloudmight-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cloudmight.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata: